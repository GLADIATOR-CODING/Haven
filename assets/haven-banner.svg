<svg width="1200" height="260" viewBox="0 0 1200 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="50%" stop-color="#121217"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Accent Red/Crimson Gradient -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="50%" stop-color="#3f3f46"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>

    <!-- Radial ambient glows -->
    <radialGradient id="glowRed" cx="20%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0a0a0c" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowCyan" cx="85%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0a0a0c" stop-opacity="0"/>
    </radialGradient>

    <!-- Pattern for grid -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#27272a" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Container Box with Rounded Corners -->
  <rect x="2" y="2" width="1196" height="256" rx="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="1196" height="256" rx="16" fill="url(#glowRed)"/>
  <rect x="2" y="2" width="1196" height="256" rx="16" fill="url(#glowCyan)"/>
  <rect x="2" y="2" width="1196" height="256" rx="16" fill="url(#grid)"/>
  <rect x="2" y="2" width="1196" height="256" rx="16" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Left Accent Bar -->
  <rect x="40" y="44" width="4" height="172" rx="2" fill="url(#primaryGlow)"/>

  <!-- Telemetry Badge Top -->
  <g transform="translate(64, 44)">
    <rect width="270" height="26" rx="13" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#10b981"/>
    <text x="26" y="17" fill="#a1a1aa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1">
      ZERO-LEAK PHYSICAL CUSTODY
    </text>
  </g>

  <!-- Main Title: HAVEN -->
  <text x="64" y="128" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="900" letter-spacing="3">
    H A V E N
  </text>

  <!-- Subtitle -->
  <text x="64" y="162" fill="#d4d4d8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500">
    Universal Lost &amp; Found Platform for Physical Spaces
  </text>

  <!-- Feature Chips Row -->
  <g transform="translate(64, 186)">
    <!-- Chip 1: Under 45s Intake -->
    <rect x="0" y="0" width="148" height="28" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <text x="12" y="18" fill="#e11d48" font-family="monospace" font-size="12" font-weight="700">⏱ ~22s INTAKE</text>

    <!-- Chip 2: 0-Bytes EXIF Leak -->
    <rect x="160" y="0" width="176" height="28" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <text x="172" y="18" fill="#10b981" font-family="monospace" font-size="12" font-weight="700">🛡 0-BYTES EXIF LEAK</text>

    <!-- Chip 3: HMAC Blind Verification -->
    <rect x="348" y="0" width="206" height="28" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <text x="360" y="18" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="700">🔐 HMAC BLIND PROOFS</text>

    <!-- Chip 4: Multi-Tenant SaaS -->
    <rect x="566" y="0" width="172" height="28" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
    <text x="578" y="18" fill="#f59e0b" font-family="monospace" font-size="12" font-weight="700">🏢 MULTI-TENANT SAAS</text>
  </g>

  <!-- Right Decorative Shield Graphic -->
  <g transform="translate(980, 50)" opacity="0.9">
    <circle cx="80" cy="80" r="76" stroke="#27272a" stroke-width="1" fill="none" stroke-dasharray="4 4"/>
    <circle cx="80" cy="80" r="54" stroke="#e11d48" stroke-width="1" stroke-opacity="0.3" fill="none"/>
    <path d="M80 32 L120 50 V90 C120 120 80 136 80 136 C80 136 40 120 40 90 V50 L80 32 Z" fill="#18181b" stroke="url(#primaryGlow)" stroke-width="2.5"/>
    <!-- Checkmark inside Shield -->
    <path d="M68 84 L76 92 L94 72" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
